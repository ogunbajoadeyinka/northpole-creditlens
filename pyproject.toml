[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northpole-creditlens"
version = "0.1.0"
description = "NorthPole CreditLens credit risk decision intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pydantic>=2.8",
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
data = ["ucimlrepo>=0.0.7"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "jupyterlab>=4.2",
]
ml = [
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "shap>=0.46",
  "scipy>=1.14",
  "statsmodels>=0.14",
]
app = ["streamlit>=1.37"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
